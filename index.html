<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi ATK HRD-GA</title>

    <meta name="theme-color" content="#f472b6">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10">
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10"> 

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50/50 to-pink-100/60 min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white/90 backdrop-blur-md w-full max-w-xl rounded-3xl shadow-xl p-6 sm:p-8 border border-pink-100 mb-4">
        
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSpjjQ0KG8XLk69cJr3Es786wKiB3ug-v46kmbatp05O_-Lop7co52YEUvS&s=10" alt="Logo Aplikasi" class="w-16 h-16 object-contain rounded-2xl bg-pink-50 p-2.5 border border-pink-200/60 shadow-sm">
            </div>
            <h1 class="text-xl font-bold text-slate-800 tracking-normal">Reservasi ATK</h1>
            <p class="text-xs font-medium text-pink-500 tracking-wider uppercase mt-1">HRD-GA Department</p>
        </div>

        <div id="atkForm" class="space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Peminta</label>
                    <input type="text" id="namaPeminta" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Nama Lengkap">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Email Peminta</label>
                    <input type="email" id="emailPeminta" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="email@company.com">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Departemen</label>
                    <input type="text" id="departemen" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="Departemen">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">No Reservasi</label>
                    <input type="text" id="noReservasi" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm placeholder-slate-400" placeholder="No. Dokumen/Ref">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Reservasi</label>
                    <input type="date" id="tglReservasi" class="w-full px-4 py-2.5 bg-slate-50/70 border border-slate-200/80 rounded-xl focus:ring-2 focus:ring-pink-400 focus:bg-white outline-none transition text-slate-700 text-sm">
                </div>
            </div>

            <hr class="border-pink-100 my-2">

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-600 uppercase tracking-wider">Daftar Barang ATK (MID, Nama, Qty)</label>
                    <button type="button" onclick="tambahBaris()" class="text-xs font-semibold text-pink-600 bg-pink-50 hover:bg-pink-100 px-3 py-1.5 rounded-lg border border-pink-200 transition">
                        + Tambah Barang
                    </button>
                </div>

                <div id="itemContainer" class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
                    <div class="item-row flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-400 w-5 text-center">1.</span>
                        <input type="text" placeholder="MID" class="mid-barang w-28 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none" oninput="cariNamaBarang(this)">
                        <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none">
                        <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-20 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-pink-400 outline-none">
                    </div>
                    <div class="item-row flex items-center gap-2">
                        <span class="text-xs font-bold text-slate-400 w-5 text-center">2.</span>
                        <input type="text" placeholder="MID" class="mid-barang w-28 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none" oninput="cariNamaBarang(this)">
                        <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none">
                        <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-20 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-pink-400 outline-none">
                    </div>
                </div>
            </div>

            <button onclick="submitATK()" id="submitBtn" class="w-full mt-4 bg-pink-500 hover:bg-pink-600 active:scale-[0.98] text-white font-semibold text-sm py-3.5 rounded-2xl shadow-md shadow-pink-500/20 transition-all duration-200">
                Kirim Reservasi
            </button>
        </div>
    </div>

    <footer class="text-center text-xs text-slate-500 font-medium">
        &copy; 2026 by HRD-GA Dept
    </footer>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw-w-HYuLvo2HoyWb8NdWIlnupNyhnCDGdYfPAYlMmf_OX9aoAPvaIgoNe8iKnNZf6N/exec';
        let masterMIDData = {};

        // Ambil data Master MID saat halaman pertama kali dimuat
        window.onload = function() {
            document.getElementById('tglReservasi').valueAsDate = new Date();

            fetch(WEB_APP_URL + '?action=getMasterMID')
                .then(response => response.json())
                .then(result => {
                    if (result.status === "success") {
                        masterMIDData = result.data;
                    }
                })
                .catch(err => console.log('Gagal memuat Master MID:', err));
        };

        // Fungsi otomatis mencari dan mengisi nama barang berdasarkan ketikan MID
        function cariNamaBarang(inputElement) {
            const midValue = inputElement.value.trim();
            const row = inputElement.closest('.item-row');
            const namaBarangInput = row.querySelector('.nama-barang');

            if (masterMIDData[midValue]) {
                namaBarangInput.value = masterMIDData[midValue];
            } else if (midValue === "") {
                namaBarangInput.value = "";
            }
        }

        function tambahBaris() {
            const container = document.getElementById('itemContainer');
            const rowCount = container.getElementsByClassName('item-row').length + 1;

            const newRow = document.createElement('div');
            newRow.className = 'item-row flex items-center gap-2';
            newRow.innerHTML = `
                <span class="text-xs font-bold text-slate-400 w-5 text-center">${rowCount}.</span>
                <input type="text" placeholder="MID" class="mid-barang w-28 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none" oninput="cariNamaBarang(this)">
                <input type="text" placeholder="Nama Barang ATK" class="nama-barang flex-1 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm focus:ring-2 focus:ring-pink-400 outline-none">
                <input type="number" value="1" min="1" placeholder="Qty" class="qty-barang w-20 px-3 py-2 bg-slate-50/70 border border-slate-200/80 rounded-xl text-sm text-center focus:ring-2 focus:ring-pink-400 outline-none">
                <button type="button" onclick="hapusBaris(this)" class="text-rose-400 hover:text-rose-600 p-1 text-xs font-bold">✕</button>
            `;
            container.appendChild(newRow);
            perbaruiNomorUrut();
        }

        function hapusBaris(button) {
            button.parentElement.remove();
            perbaruiNomorUrut();
        }

        function perbaruiNomorUrut() {
            const rows = document.querySelectorAll('#itemContainer .item-row');
            rows.forEach((row, index) => {
                row.querySelector('span').innerText = (index + 1) + '.';
            });
        }

        function submitATK() {
            const nama = document.getElementById('namaPeminta').value.trim();
            const email = document.getElementById('emailPeminta').value.trim();
            const departemen = document.getElementById('departemen').value.trim();
            const noReservasi = document.getElementById('noReservasi').value.trim();
            const tglReservasi = document.getElementById('tglReservasi').value;

            if (!nama || !email || !departemen || !noReservasi || !tglReservasi) {
                alert('Mohon lengkapi seluruh data peminta, departemen, dan nomor reservasi!');
                return;
            }

            const rowItems = document.querySelectorAll('#itemContainer .item-row');
            let itemsArray = [];

            rowItems.forEach((row) => {
                const midBarang = row.querySelector('.mid-barang').value.trim();
                const namaBarang = row.querySelector('.nama-barang').value.trim();
                const qty = row.querySelector('.qty-barang').value;

                if (namaBarang || midBarang) {
                    itemsArray.push({
                        mid: midBarang,
                        namaBarang: namaBarang || "Barang Manual",
                        qty: parseInt(qty) || 1
                    });
                }
            });

            if (itemsArray.length === 0) {
                alert('Masukkan minimal 1 barang ATK yang ingin direservasi!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Menyimpan...';

            const payload = {
                namaPeminta: nama,
                emailPeminta: email,
                departemen: departemen,
                noReservasi: noReservasi,
                tglReservasi: tglReservasi,
                items: itemsArray
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    alert('Reservasi berhasil! Data tercatat ke sheet INPUT.');
                    location.reload();
                } else {
                    alert('Gagal menyimpan: ' + result.message);
                    btn.disabled = false;
                    btn.innerText = 'Kirim Reservasi';
                }
            })
            .catch((error) => {
                alert('Terjadi kesalahan koneksi ke server: ' + error);
                btn.disabled = false;
                btn.innerText = 'Kirim Reservasi';
            });
        }
    </script>
</body>
</html>
